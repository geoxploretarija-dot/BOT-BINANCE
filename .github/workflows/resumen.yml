name: Resumen de trading (cada 2 dias)

on:
  schedule:
    - cron: "0 10 */2 * *"   # cada 2 dias a las 10:00 UTC
  workflow_dispatch:

jobs:
  resumen:
    runs-on: ubuntu-latest
    steps:
      - name: Enviar resumen a Telegram
        env:
          BOT_URL: https://bot-binance-fv81.onrender.com/report
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          RESP=$(curl -sf "$BOT_URL")
          RUNNING=$(echo "$RESP" | jq -r '.bot.running')
          ERRORS=$(echo "$RESP" | jq -r '.bot.errors')
          CYCLE=$(echo "$RESP" | jq -r '.bot.last_cycle')
          POS_JSON=$(echo "$RESP" | jq -r '.position')
          T_TOTAL=$(echo "$RESP" | jq -r '.trades.total // 0')
          T_WIN=$(echo "$RESP" | jq -r '.trades.win_rate // 0')
          T_PNL=$(echo "$RESP" | jq -r '.trades.pnl_total // 0')

          if [ "$POS_JSON" != "null" ]; then
            EPRICE=$(echo "$RESP" | jq -r '.position.entry_price')
            SL=$(echo "$RESP" | jq -r '.position.stop_loss')
            POS_TXT="📈 POSICION ABIERTA: entrada ${EPRICE} | SL ${SL}"
          else
            POS_TXT="Sin posicion abierta"
          fi

          MSG="📊 RESUMEN CADA 2 DIAS%0A"
          MSG+="%0A🤖 Bot: $( [ "$RUNNING" = "true" ] && echo '🟢 ACTIVO' || echo '🔴 DETENIDO' )"
          MSG+="%0A🕐 Ultimo ciclo: $CYCLE"
          MSG+="%0A⚠️ Errores: $ERRORS"
          MSG+="%0A%0A$POS_TXT"
          MSG+="%0A%0A📈 Historial: $T_TOTAL trades"
          MSG+="%0A🎯 Win rate: ${T_WIN}%%"
          MSG+="%0A💰 PnL total: ${T_PNL} USD (simulado)"

          curl -sf "https://api.telegram.org/bot$TELEGRAM_TOKEN/sendMessage" \
            -d "chat_id=$TELEGRAM_CHAT_ID" -d "text=$MSG"
